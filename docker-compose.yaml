# The whole backend in containers: PostgreSQL, Mailpit and the application. From this folder:
#   docker compose up -d --build     build the application and start everything
#   docker compose logs -f backend   follow the application's log
#   docker compose down              stop (the database stays in ./db/data)
#
# API at http://localhost:8080/api, letters at http://localhost:8025.
#
# Values come from .env next to this file when it exists (copy .env.example), otherwise from the
# defaults below. Database and mail hosts are always the containers' own names.
#
# This replaces db/docker-compose.yaml and docker/docker-compose.yaml, which start only the
# database and Mailpit for running the application from an IDE. Run one way or the other: both
# publish the same ports and share ./db/data.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: prepdeck
      POSTGRES_USER: ${PREPDECK_DB_USER:-prepdeck}
      POSTGRES_PASSWORD: ${PREPDECK_DB_PASSWORD:-prepdeck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Catches every letter the backend sends: nothing leaves this machine.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PREPDECK_DB_URL: jdbc:postgresql://postgres:5432/prepdeck
      PREPDECK_DB_USER: ${PREPDECK_DB_USER:-prepdeck}
      PREPDECK_DB_PASSWORD: ${PREPDECK_DB_PASSWORD:-prepdeck}
      # Empty: a random key per start, so sessions end when the container restarts.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-prep-deck}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: "${MAIL_FROM:-Prep Deck <no-reply@prepdeck.local>}"
      MAIL_SUPPORT: ${MAIL_SUPPORT:-support@prepdeck.local}
      IMAGES_STORAGE: ${IMAGES_STORAGE:-LOCAL}
      IMAGES_DIR: /data/images
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SHARE_LINK_BASE_URL: ${SHARE_LINK_BASE_URL:-prepdeck://topic/}
      # prep-deck.cors.allowed-origins: the client's dev server and its web container.
      PREPDECK_CORS_ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
    volumes:
      - images:/data/images
    restart: unless-stopped

volumes:
  images:
