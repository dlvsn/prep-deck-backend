spring.application.name=prep-deck-backend
server.port=8080
# Local settings and secrets: .env in the working directory, git-ignored (see .env.example).
# Real environment variables override it.
spring.config.import=optional:file:.env[.properties]

# Every endpoint lives under /api; paths in code (ApiPaths, SecurityConfig) are relative to it.
server.servlet.context-path=/api

# ---- database: PostgreSQL; a local one runs from db/ (docker compose up -d there)
spring.datasource.url=${PREPDECK_DB_URL}
spring.datasource.username=${PREPDECK_DB_USER}
spring.datasource.password=${PREPDECK_DB_PASSWORD}

# The schema belongs to Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=prep_deck
# Timestamps go to the database in UTC (the JVM is set to UTC in PrepDeckBackendApplication too).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Cards load their tags and images in batches instead of one query per card.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Migrations create the prep_deck schema themselves (V1.0.0); Flyway keeps its history in public.
spring.flyway.locations=classpath:db/migration

# ---- authentication
# HMAC key for access tokens, at least 32 bytes. JWT_SECRET must be defined; left empty, a random
# key is made per start (fine locally: access tokens die with the process, refresh tokens live in
# the database and carry on).
prep-deck.jwt.secret=${JWT_SECRET}
prep-deck.jwt.issuer=${JWT_ISSUER}
prep-deck.jwt.access-ttl=${JWT_ACCESS_TTL}
prep-deck.jwt.refresh-ttl=${JWT_REFRESH_TTL}

# ---- email: any SMTP server. Locally: Mailpit from docker/docker-compose.yaml (letters at :8025).
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS}
prep-deck.mail.from=${MAIL_FROM}
prep-deck.mail.support-email=${MAIL_SUPPORT}
# Letter templates: <location><name>-<en|uk><suffix>, e.g. classpath:templates/verify-email-uk.html
prep-deck.mail.templates.location=classpath:templates/
prep-deck.mail.templates.suffix=.html
prep-deck.mail.templates.fallback-language=EN
prep-deck.mail.templates.verify-email=verify-email
prep-deck.mail.templates.reset-password=reset-password

# ---- one-time codes sent by email
prep-deck.verification.code-ttl=15m
prep-deck.verification.max-attempts=5
prep-deck.verification.resend-cooldown=60s

# ---- card images
# LOCAL: files in a folder on this machine. S3: objects in an S3-compatible bucket (Cloudflare R2).
prep-deck.images.storage=${IMAGES_STORAGE}
# LOCAL: where uploaded files are kept, one file per image named by its id.
prep-deck.images.directory=${IMAGES_DIR}
# S3: the bucket; for R2 the endpoint is https://<account id>.r2.cloudflarestorage.com, region auto.
prep-deck.images.s3.endpoint=${S3_ENDPOINT}
prep-deck.images.s3.region=${S3_REGION}
prep-deck.images.s3.bucket=${S3_BUCKET}
prep-deck.images.s3.key-prefix=images/
prep-deck.images.s3.access-key-id=${S3_ACCESS_KEY_ID}
prep-deck.images.s3.secret-access-key=${S3_SECRET_ACCESS_KEY}
prep-deck.images.max-size=10MB
# The smallest picture accepted, in pixels as displayed (EXIF rotation applied).
prep-deck.images.min-width=64
prep-deck.images.min-height=64
prep-deck.images.max-per-card=5
# An upload no card refers to is removed after this long (images go up before the card is saved).
prep-deck.images.orphan-ttl=24h
prep-deck.images.cleanup-interval=1h
# The servlet container stops reading a file part past this size; the request holds that one part.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- cards
prep-deck.cards.max-tags=10

# Origins allowed to call the API from a browser: the client's dev server for now.
# Paths are relative to the context path: /** = every endpoint under /api.
prep-deck.cors.mapping=/**
prep-deck.cors.allowed-origins=http://localhost:5173
