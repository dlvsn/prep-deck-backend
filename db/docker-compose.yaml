# Local PostgreSQL for development. From this folder:
#   docker compose up -d      start
#   docker compose down       stop (the data stays in ./data)
# Credentials come from .env next to this file; copy .env.example if it is missing.
services:
  postgres:
    image: postgres:17
    container_name: prep-deck-postgres
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The database files live in db/data, beside this file (git-ignored).
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
